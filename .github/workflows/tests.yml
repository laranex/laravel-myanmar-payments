name: tests

on:
  push:
    branches:
      - '**'
    tags:
      - '**'
  pull_request:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        php: [8.1, 8.2, 8.3, 8.4, 8.5]
        laravel: [10.*, 11.*, 12.*, 13.*]
        stability: [prefer-lowest, prefer-stable]
        include:
          - laravel: 10.*
            testbench: 8.*
          - laravel: 11.*
            testbench: 9.*
          - laravel: 12.*
            testbench: 10.*
          - laravel: 13.*
            testbench: 11.*
        exclude:
          - laravel: 10.*
            php: 8.4
          - laravel: 10.*
            php: 8.5
          - laravel: 11.*
            php: 8.1
          - laravel: 11.*
            php: 8.5
          - laravel: 12.*
            php: 8.1
          - laravel: 13.*
            php: 8.1
          - laravel: 13.*
            php: 8.2

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.stability }} - ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          # FFI is disabled so the type-coverage plugin analyses files in a single
          # process: its forked workers share one cache file whose lock gives up
          # after 100 ms, and concurrent writes then corrupt it (ParseError).
          extensions: dom, curl, libxml, mbstring, zip, fileinfo, sqlite, pdo_sqlite, bcmath, intl, :ffi
          ini-values: error_reporting=E_ALL
          tools: composer:v2
          coverage: none

      - name: Checkout laranex/php-myanmar-payments
        shell: bash
        env:
          LARANEX_PACKAGES_TOKEN: ${{ secrets.LARANEX_PACKAGES_TOKEN }}
        run: |
          if [ -z "$LARANEX_PACKAGES_TOKEN" ]; then
            echo "::error title=Missing LARANEX_PACKAGES_TOKEN::laranex/php-myanmar-payments is private. Add a LARANEX_PACKAGES_TOKEN secret with read access to it (see .github/CONTRIBUTING.md); forked pull requests do not receive secrets."
            exit 1
          fi
          repo="https://x-access-token:${LARANEX_PACKAGES_TOKEN}@github.com/laranex/php-myanmar-payments.git"
          git clone --depth 1 --branch dev "$repo" ../php-myanmar-payments \
            || git clone --depth 1 --branch main "$repo" ../php-myanmar-payments

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" --no-interaction --no-update
          # --with intersects the lane's Testbench line with the floor in composer.json
          # (e.g. ^8.29), where `composer require` would replace it with 8.* and let
          # prefer-lowest pick a Testbench release this package does not support.
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction --no-progress --no-scripts --with "orchestra/testbench:${{ matrix.testbench }}"
          composer run prepare

      - name: PHPStan
        run: composer analyse

      - name: Linter
        run: composer lint:check

      - name: Type Coverage
        if: runner.os != 'Windows'
        run: composer test:types

      - name: Test Suite
        if: runner.os != 'Windows'
        run: composer test:unit

      - name: Test Suite (Windows)
        if: runner.os == 'Windows'
        run: vendor/bin/pest
